[package]
name = "remarkable-cli"
version = "0.1.0"
edition = "2024"
description = "Cloud Sync v3, native handwriting, and PDF tools for reMarkable"
license = "MIT"

[[bin]]
name = "remarkable"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["string"] }
clap_complete = "4.6"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
remarkable-cloud = { git = "https://github.com/alexgorbatchev/remarkable-cloud-rust.git", rev = "c3087d0324323e35dded5a0cce9f82ea11ab9090" }
remarkable-render = { git = "https://github.com/alexgorbatchev/remarkable-render-rust.git", rev = "28e2cac20bb2a950753627d120dd14c9cfd16985" }
rmscene = { git = "https://github.com/alexgorbatchev/rmscene-rust.git", rev = "13956586612431995d3481875e945917d0b2d0d9" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
thiserror = "2"
reqwest = { version = "0.13.5", default-features = false }
hyper = "1"
dirs = "7"
comfy-table = { version = "7", default-features = false }
icu_casemap = "2.3"
unicode-general-category = "1"
num-bigint = "0.4"
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
libc = "0.2"
tiny_http = "0.12"
pdfium-bundled = "0.2"

